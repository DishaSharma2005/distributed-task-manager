name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────────────
  # JOB 1: Run automated tests
  # The build/deploy jobs only run if this passes.
  # ────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Tests use in-memory MongoDB — no real DB needed
          INSTANCE_ID: CI-TEST-INSTANCE

  # ────────────────────────────────────────────────────────
  # JOB 2: Build and push Docker image to GHCR
  # Only runs on push to main AND only if tests pass.
  # ────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ────────────────────────────────────────────────────────
  # JOB 3: Deploy to EC2 Instance 1
  # ────────────────────────────────────────────────────────
  deploy-instance-1:
    name: Deploy to EC2 Instance 1
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2 Instance 1 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST_1 }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          port:        22
          script: |
            # Pull the latest image from GHCR
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            docker pull ghcr.io/dishasharma2005/distributed-task-manager:latest

            # Stop and remove the existing container (ignore error if not running)
            docker stop task-manager || true
            docker rm   task-manager || true

            # Start the updated container
            docker run -d \
              --name task-manager \
              --restart unless-stopped \
              -p 3000:3000 \
              -e PORT=3000 \
              -e INSTANCE_ID=EC2-INSTANCE-1 \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              ghcr.io/dishasharma2005/distributed-task-manager:latest

            echo "Deployment to EC2 Instance 1 complete."

  # ────────────────────────────────────────────────────────
  # JOB 4: Deploy to EC2 Instance 2
  # ────────────────────────────────────────────────────────
  deploy-instance-2:
    name: Deploy to EC2 Instance 2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2 Instance 2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST_2 }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          port:        22
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            docker pull ghcr.io/dishasharma2005/distributed-task-manager:latest

            docker stop task-manager || true
            docker rm   task-manager || true

            docker run -d \
              --name task-manager \
              --restart unless-stopped \
              -p 3000:3000 \
              -e PORT=3000 \
              -e INSTANCE_ID=EC2-INSTANCE-2 \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              ghcr.io/dishasharma2005/distributed-task-manager:latest

            echo "Deployment to EC2 Instance 2 complete."
