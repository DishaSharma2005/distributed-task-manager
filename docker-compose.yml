version: '3.8'

services:
  # ─── Application service ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/taskmanager}
      INSTANCE_ID: ${INSTANCE_ID:-LOCAL}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ─── Local MongoDB (only used in docker-compose, not in production) ──
  mongo:
    image: mongo:7-jammy
    container_name: task-manager-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
